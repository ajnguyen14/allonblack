# XcodeGen spec. Regenerate the project with:  cd iOSApp && xcodegen generate
name: DishonestCasino
options:
  bundleIdPrefix: edu.berkeley.bioe131
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HMMCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your Apple ID team in Xcode (Signing & Capabilities) or put the 10-char Team ID here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  DishonestCasino:
    type: application
    platform: iOS
    sources:
      - DishonestCasino
    dependencies:
      - package: HMMCore
        product: HMMCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.berkeley.bioe131.dishonestcasino
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Dishonest Casino"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Listens for the dealer's announced die roll (via your Meta glasses' Bluetooth microphone or the phone microphone) to update the HMM."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Converts the spoken die number (one to six) into an observation. On-device recognition is used when available."
  HMMCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/HMMCoreTests
    dependencies:
      - package: HMMCore
        product: HMMCore
      - package: HMMCore
        product: HMMVerification
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DishonestCasino:
    build:
      targets:
        DishonestCasino: all
    test:
      targets:
        - HMMCoreTests
